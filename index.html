<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#12070e"/>
  <meta name="description" content="Un cumpleaños de película para Lenin."/>
  <title>Lenin's Birthday</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Inter:wght@700;800&family=Italiana&display=swap" rel="stylesheet"/>
  <style>
    body{margin:0;background:#15080d;color:#ffe4e5;font-family:Arial,sans-serif}
    .static-fallback{max-width:850px;margin:auto;text-align:center;padding:24px 20px 80px}
    .static-fallback img{width:100%;max-height:580px;object-fit:cover;object-position:center 34%;display:block}
    .static-fallback h1{font:normal clamp(54px,10vw,105px) Italiana,serif;line-height:.95;margin:64px 0 20px}
    .static-fallback p{color:#ddb7c4;line-height:1.6}
    .static-count{border:1px solid #79465a;padding:22px;margin:42px 0;font-size:18px}
    .static-fallback iframe{border:0;border-radius:12px;width:100%;height:152px}
  </style>
</head>
<body>
  <div id="root">
    <main class="static-fallback">
      <img src="./lenin-preview.png" alt="Retrato de Lenin"/>
      <h1>Lenin's Birthday</h1>
      <p>Que este nuevo capítulo sea tan inolvidable como tú. ✨</p>
      <div class="static-count">12 de noviembre de 2026 · Medianoche en Neuquén, Argentina</div>
      <iframe title="Nicole Kidman de ADÉLA en Spotify" src="https://open.spotify.com/embed/track/70cHKK8bHAfJrOGVnfRG9J" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </main>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
